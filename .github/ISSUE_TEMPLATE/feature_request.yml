name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Explain the problem or use case first. This helps evaluate possible solutions without prematurely limiting the implementation.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the situation that makes this feature useful.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what you would like Xray Extender to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any existing workaround or alternative you have considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or other context. Remove secrets and personal data.
    validations:
      required: false
